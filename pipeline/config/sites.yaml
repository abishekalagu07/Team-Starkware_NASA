# NISAR Earth Pulse — showcase sites (one per kind of change, every continent we could cover).
#
# bbox = [west, south, east, north] in degrees. Keep boxes <= ~1 deg: GCOV is posted at
# 10-20 m, so a 1x1 deg box is ~5000x5000 px per polarisation per date.
# window = acquisition dates to search. Calibrated (PROVISIONAL) L-band data start 2026-06-17.
# Coordinates marked `verify` were taken from news/agency reports — refine them in hour 1
# with the official perimeter (NIFC / EFFIS / USGS) before processing.

defaults:
  maturity: PROVISIONAL
  max_frames: 12
  max_px: 900
  terms: [HHHH, HVHV]

sites:
  - id: assam-brahmaputra
    name: Brahmaputra floodplain, Assam
    region: India
    continent: Asia
    change_type: flood
    product: GCOV
    bbox: [93.60, 26.55, 94.70, 27.15]          # Jorhat - Majuli river island
    window: ["2026-06-17", "2026-10-31"]
    event_date: "2026-07-15"                     # floods began mid-July, peaked early Aug
    s_band: true                                 # dual-frequency comparison via Bhoonidhi
    story:
      headline: "Monsoon floodwater along the Brahmaputra, seen through the cloud"
      what: "Open floodwater spreading over farmland and villages along the Brahmaputra, then draining away."
      physics: "Calm water mirrors the radar pulse away from the satellite, so HH backscatter collapses (black). Where water sits beneath crops or trees, L-band's 24 cm wave bounces water->stem->satellite and HH turns brighter: the flooded-vegetation class optical satellites and C-band radar mostly miss."
      drivers: "Monsoon rain several times above normal in upper Assam, sediment-choked braided channels, embankment breaches, wetland loss and upstream deforestation."
      caveats: "Wind-roughened water can look bright; very smooth sand bars can look like water. Compare against GPM rainfall and gauge data."

  - id: punjab-paddy
    name: Kharif paddy belt, Punjab
    region: India
    continent: Asia
    change_type: crop
    product: GCOV
    bbox: [75.60, 30.20, 76.30, 30.75]
    window: ["2026-06-17", "2026-11-10"]
    s_band: true
    story:
      headline: "Watching a rice season breathe, field by field"
      what: "Paddies are flooded for transplanting (dark), the canopy grows (bright), then harvest and residue burning reset them. Only fields showing the full flood-then-growth signature are labelled rice; fields with a weaker swing fall under 'other active cropland', so the rice figure is a lower bound."
      physics: "Flooded paddy = specular water, very dark. As rice tillers grow, volume scattering raises HV by 5-10 dB within weeks. The V-shaped HV curve is the radar fingerprint of rice. S-band responds more to leaves, L-band to stems and the soil-water interface."
      drivers: "Monsoon-timed transplanting, groundwater irrigation, procurement-driven rice monoculture, Aug-Sep 2026 floods that destroyed standing crops."
      caveats: "Rain on bare soil also brightens HH; use HV and the temporal shape, not single dates."

  - id: kuttanad-kerala
    name: Kuttanad wetland rice bowl, Kerala
    region: India
    continent: Asia
    change_type: flood
    product: GCOV
    bbox: [76.20, 9.20, 76.70, 9.80]             # same AOI as the Colab notebook (Untitled0.ipynb)
    window: ["2026-06-17", "2026-11-14"]
    event_date: "2026-08-12"                     # NISAR: dry on 6 Aug, flooded on 18 Aug (onset between the two passes)
    prefer_direction: D                          # notebook used descending track 077 frame 084
    story:
      headline: "Farming below sea level: Kuttanad's monsoon waters, through the cloud"
      what: "Polder fields and backwater margins flood between the 6 and 18 August passes, stay inundated through September, peak on 5 October (574 km² of open water plus 251 km² of water under canopy) and have largely drained by 17 October."
      physics: "Open water is a mirror to the radar, so HH drops to near-black; water under rice or coconut canopy bounces water->stem->satellite and brightens HH. The HH/HV ratio separates the two."
      drivers: "Monsoon rain on a polder landscape that lies partly below sea level, river inflow from the Western Ghats, bund breaches and the Thanneermukkom barrage regime."
      caveats: "Polders are flooded on purpose for cultivation, so not all water is a disaster; separate managed flooding from inundation with dates and field context."

  - id: venezuela-doublet
    name: Venezuela M7.2 + M7.5 doublet
    region: Venezuela
    continent: South America
    change_type: earthquake
    product: GUNW
    bbox: [-69.00, 9.95, -66.80, 10.90]          # San Felipe -> Caracas coast (verify)
    window: ["2026-06-01", "2026-08-15"]
    event_date: "2026-06-24T22:04:00"
    epicenters: [[-68.556, 10.371], [-67.21, 10.60]]
    phase_sign: -1
    story:
      headline: "Two great earthquakes 39 seconds apart, measured to the centimetre"
      what: "Co-seismic ground displacement from strike-slip rupture along the Caribbean-South American plate boundary."
      physics: "Interferometry compares the phase of two passes 12 days apart; each colour cycle of fringes is 11.9 cm of motion along the radar line of sight. L-band keeps coherence over the forested Cordillera de la Costa where C-band decorrelates."
      drivers: "Right-lateral shear between the Caribbean and South American plates (San Sebastian - El Pilar fault system)."
      caveats: "LOS is 1-D: strike-slip motion is mostly horizontal, so ascending and descending tracks show different patterns; combine them for east/up. L-band ionosphere near the equator can add cm-scale ramps - the GUNW ionospheric screen is subtracted."

  - id: mexico-city
    name: Mexico City subsidence
    region: Mexico
    continent: North America
    change_type: subsidence
    product: GUNW
    bbox: [-99.25, 19.25, -98.85, 19.60]
    window: ["2026-06-17", "2026-11-10"]
    phase_sign: -1
    reference_bbox: [-99.24, 19.40, -99.20, 19.44]   # volcanic bedrock, west hills (verify)
    story:
      headline: "A megacity sinking up to a few centimetres a month"
      what: "Ground subsidence from aquifer over-pumping, accumulated over successive 12-day interferograms."
      physics: "Each 12-day pair measures line-of-sight shortening/lengthening; chaining pairs builds a displacement time series. Lake-bed clays compact as pore pressure drops."
      drivers: "Groundwater extraction for ~22 million people, compressible lacustrine clays of former Lake Texcoco."
      caveats: "Simple pair chaining accumulates noise; for publication-grade rates use SBAS (MintPy) on the full stack. Atmospheric delay in the rainy season adds cm-scale patterns."

  - id: rowe-creek-fire
    name: Rowe Creek Complex fire, Oregon
    region: USA
    continent: North America
    change_type: disturbance
    product: GCOV
    bbox: [-120.70, 44.35, -119.80, 44.95]       # Crook/Jefferson/Wheeler counties (verify w/ NIFC perimeter)
    window: ["2026-06-17", "2026-10-31"]
    event_date: "2026-07-20"
    story:
      headline: "An Oregon fire complex: canopy loss through the smoke"
      what: "141 km² of canopy loss accumulating from mid-July into October across grass, shrub and juniper country. The modest HV drop (about -2.4 dB) is what L-band sees when fuels with little canopy volume burn; forest fires drop further."
      physics: "HV (cross-pol) comes from multiple scattering inside the canopy. Burning removes that volume, so HV drops 3-6 dB and stays low; HH may briefly rise from exposed, rough, wet soil."
      drivers: "Low snowpack, drought, dry lightning, decades of fuel build-up."
      caveats: "Grass/shrub fires (e.g. Big Grass Fire) barely change L-band HV: there is little volume to lose. That is a physics result, not a failure."

  - id: huelva-fire
    name: Huelva wildfire, Spain
    region: Spain
    continent: Europe
    change_type: disturbance
    product: GCOV
    bbox: [-7.20, 37.40, -6.40, 38.00]           # set from EFFIS perimeter (verify)
    window: ["2026-06-17", "2026-10-31"]
    event_date: "2026-08-10"
    story:
      headline: "A summer of canopy loss in Huelva's plantations, seen through the smoke"
      what: "132 km² of HV canopy loss that begins between the 21 July and 14 August passes and keeps deepening into October - the pattern of a large summer fire followed by salvage clearing. Confirm the perimeter against EFFIS before calling all of it burn."
      physics: "Same HV volume-loss signature as forest fires elsewhere; Mediterranean eucalyptus/pine plantations give a strong pre-fire HV baseline."
      drivers: "Heatwaves, drought, plantation fuels, rural depopulation."
      caveats: "Harvest of plantation stands also lowers HV - confirm with EFFIS/FIRMS fire detections."

  - id: amazon-br163
    name: BR-163 deforestation arc, Para
    region: Brazil
    continent: South America
    change_type: disturbance
    product: GCOV
    bbox: [-55.60, -7.60, -54.80, -6.90]
    window: ["2026-06-17", "2026-11-10"]
    event_date: "2026-07-15"
    story:
      headline: "The Amazon's dry-season clearing front"
      what: "New clearings (fishbone pattern) and fire along the BR-163 highway."
      physics: "Clear-cutting removes canopy volume: HV drops. Cloud and smoke never stop the radar, which is why SAR underpins near-real-time deforestation alerts."
      drivers: "Cattle pasture expansion, land grabbing along roads, soy logistics corridor."
      caveats: "Selective logging leaves canopy gaps below the 20 m pixel; HV change can be subtle."

  - id: sudd-wetland
    name: Sudd wetland, South Sudan
    region: South Sudan
    continent: Africa
    change_type: flood
    product: GCOV
    bbox: [30.40, 7.00, 31.40, 8.00]
    window: ["2026-06-17", "2026-11-10"]
    event_date: "2026-08-01"
    story:
      headline: "Africa's largest wetland swells with the rains"
      what: "Seasonal expansion of open water and flooded papyrus swamp along the White Nile."
      physics: "Flooded papyrus and grass produce strong HH double bounce at L-band - the swamp brightens as it floods, while open lagoons go dark."
      drivers: "East African rains feeding Lake Victoria and the White Nile, record lake levels since 2019-2020."
      caveats: "Floating vegetation mats move; very dense papyrus can saturate the signal."

  - id: sermeq-kujalleq
    name: Sermeq Kujalleq (Jakobshavn), Greenland
    region: Greenland
    continent: Arctic
    change_type: glacier
    product: GOFF
    bbox: [-50.40, 69.05, -48.80, 69.30]
    window: ["2026-06-17", "2026-11-10"]
    story:
      headline: "One of the world's fastest glaciers, tracked every 12 days"
      what: "Ice surface speed from pixel offset tracking between repeat passes: the fast trunk runs at roughly 17-28 m/day through the season, the surrounding ice at 2-4 m/day."
      physics: "Phase interferometry fails on fast-flowing, melting ice (coherence is lost), so features are cross-correlated between images; L-band penetrates the snow surface and keeps texture through melt season."
      drivers: "Warm Atlantic water melting the floating tongue, summer melt lubricating the bed, seasonal ice-melange buttressing."
      caveats: "Offsets over 12 days near the calving front can exceed the search window; check the SNR layer. A single pair can under-read speed when surface melt destroys the texture being tracked - treat an isolated dip as tracking loss, not a slowdown."
